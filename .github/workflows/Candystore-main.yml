name: Candy Store Compose Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger this manually from the GitHub Actions tab

jobs:
  run-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Required on fresh cloud runners because your compose file sets pull_policy: never
      - name: Pre-pull image so pull_policy never succeeds
        run: docker pull philippaul/candy-store:02

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Verify container and port 3000
        run: |
          docker compose ps
          sleep 3
          curl -I http://localhost:3000 || true

      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs

      - name: Stop and remove Docker Compose
        if: always()
        run: docker compose down
